<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SAI Lab — Research in artificial intelligence. Our website is coming soon.">
  <meta name="theme-color" content="#f7f7f2">
  <title>SAI Lab</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f7f2;
      --ink: #17283b;
      --muted: #566371;
      --accent: #2563c2;
      --line: #d7ddd9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding: clamp(24px, 5vw, 72px);
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      max-width: 1120px;
      min-height: calc(100vh - clamp(48px, 10vw, 144px));
      min-height: calc(100svh - clamp(48px, 10vw, 144px));
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }
    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    header { padding-bottom: 24px; border-bottom: 1px solid var(--line); }
    .wordmark { font-size: 16px; font-weight: 700; letter-spacing: .08em; }
    .domain { color: var(--muted); font-size: 14px; letter-spacing: .02em; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: clamp(64px, 12vh, 160px) 0;
    }
    .eyebrow {
      margin: 0 0 25px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(64px, 13vw, 148px);
      font-weight: 600;
      letter-spacing: -.065em;
      line-height: 1.05;
    }
    .accent { color: var(--accent); }
    .subtitle {
      max-width: 680px;
      margin: 30px 0 0;
      font-size: clamp(23px, 3.5vw, 38px);
      font-weight: 400;
      letter-spacing: -.03em;
      line-height: 1.35;
    }
    .notice {
      max-width: 480px;
      margin: 26px 0 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
    }
    footer {
      padding-top: 22px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .status { display: flex; align-items: center; gap: 9px; }
    .status::before {
      content: "";
      width: 6px;
      height: 6px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--accent);
    }
    @media (max-width: 420px) {
      header { padding-bottom: 20px; }
      footer { align-items: flex-start; flex-direction: column; gap: 10px; }
      .notice { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="wordmark">SAI LAB</div>
      <div class="domain">sailab.ai</div>
    </header>
    <main>
      <p class="eyebrow">Research in artificial intelligence</p>
      <h1>SAI Lab<span class="accent" aria-hidden="true">.</span></h1>
      <p class="subtitle">Our website is coming soon.</p>
      <p class="notice">Research, people, and publications.<br>More to share soon.</p>
    </main>
    <footer>
      <span>SAI Lab</span>
      <span class="status">Website in progress</span>
    </footer>
  </div>
</body>
</html>
